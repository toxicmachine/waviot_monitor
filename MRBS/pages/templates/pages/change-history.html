{% extends 'base.html' %}
{% load static %}
{% block main_content %}
    <div class="row mb-4">
        <div class="col-lg-12 col-12">
            <div class="custom-block bg-white">
                <h5 class="mb-2 ms-2">История изменений сервиса</h5>
                <div class="table-responsive p-2">
                    <table class="account-table table">
                        <thead>
                            <tr>
                                <th scope="col" style="width: 100px;">Версия</th>
                                <th scope="col">Описание изменений</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for elem in changes_history%}
                            <tr>
                                <td scope="row" style="width: 100px;"><span class="badge text-bg-success fs-5">{{ elem.version }}</span></td>
                                <td scope="row" class="text-start">{{ elem.description|safe|linebreaksbr  }}</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
{% block extra_scripts %}
{% endblock %}
