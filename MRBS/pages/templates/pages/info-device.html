{% extends 'base.html' %}
{% load static %}
{% block main_content %}
    <div class="row mb-4">
        <div class="col-lg-12 col-12">
            <div class="custom-block bg-white">
                <h5 class="mb-2 ms-2">Информация о приборе учета</h5>
                <div class="custom-block bg-white">
                    <div class="tab-content" id="myTabContent">
                        <div class="tab-pane fade active show" id="profile-tab-pane" role="tabpanel" aria-labelledby="profile-tab" tabindex="0">
                            <form id="device_search" class="d-flex custom-form profile-form" role="form">
                                {{ form.device_search_field }}
                                <button style="max-width: 150px;" type="submit" class="form-control ms-2">ПОИСК</button>
                            </form>
                        </div>
                    </div>
                </div>
                <div class="text-center">
                  <div id="spinner-one" class="spinner-border text-tosk" role="status" hidden="">
                    <span class="visually-hidden">Loading...</span>
                  </div>
                </div>
                <div id="device_content"></div>
            </div>
        </div>
    </div>
{% endblock %}
{% block extra_scripts %}
<script src="{% static 'pages/js/for-info-device.js' %}?20250619"></script>
{% endblock %}
