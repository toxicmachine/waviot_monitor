{% load static %}
<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="">
        <meta name="author" content="Tooplate">

        <title>{{title}}</title>

        <!-- CSS FILES -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;700&display=swap" rel="stylesheet">
        <link type="text/css" href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet" />
        <link type="text/css" href="{% static 'css/bootstrap-icons.css' %}" rel="stylesheet" />
        <link type="text/css" href="{% static 'css/apexcharts.css' %}" rel="stylesheet" />
        <link type="text/css" href="{% static 'css/tooplate-mini-finance.css' %}" rel="stylesheet" />
    </head>
    <body>
        <div style="bottom: 60px;" class="d-flex justify-content-center modal-body min-vh-100 align-items-center">
            <div class="tab-pane" id="profile-tab-pane" role="tabpanel" aria-labelledby="profile-tab" tabindex="0">
                <form style="min-width: 800px;" class="custom-form profile-form" method="post" role="form">
                    {% csrf_token %}
                    {{ form }}
                    <br>
                    <button type="submit" class="form-control">ИЗМЕНИТЬ ПАРОЛЬ</button>
                </form>
            </div>
        </div>
        <!-- JAVASCRIPT FILES -->
        <script type="text/javascript" src="{% static 'js/jquery.min.js' %}"></script>
        <script type="text/javascript" src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
        <script type="text/javascript" src="{% static 'js/apexcharts.min.js' %}"></script>
        <script type="text/javascript" src="{% static 'js/custom.js' %}"></script>
        {% block extra_scripts %} {% endblock %}
    </body>
</html>
